version: "3.9"

# Services──────
#
#   api   json-server mock REST API  →  http://localhost:4000
#   app   Next.js production build   →  http://localhost:3000
#
# Start everything:  docker compose up --build
# Tear down:         docker compose down
#─────────────────

services:

  # Mock REST API (json-server)
  api:
    image: node:20-alpine
    working_dir: /data
    # Mount db.json so edits made via the API are visible on the host too
    volumes:
      - ./db.json:/data/db.json
    command: npx --yes json-server db.json --port 4000 --host 0.0.0.0
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/users || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Next.js app─
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The browser reaches json-server on the host's exposed port.
        # Change this if you deploy json-server to a different host.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
